<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>LLDPE Plant Knowledge Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="top">
  <div class="topin">
    <div class="brand">
      <svg width="30" height="30" viewBox="0 0 30 30" aria-hidden="true"><rect x="1" y="1" width="28" height="28" rx="6" fill="var(--accent)"/><circle cx="10" cy="11" r="3" fill="none" stroke="var(--accent-ink)" stroke-width="2"/><circle cx="21" cy="11" r="3" fill="none" stroke="var(--accent-ink)" stroke-width="2"/><circle cx="15.5" cy="21" r="3" fill="none" stroke="var(--accent-ink)" stroke-width="2"/><path d="M13 11h5M11.6 13.6l2.6 4.6M19.4 13.6l-2.6 4.6" stroke="var(--accent-ink)" stroke-width="2"/></svg>
      <div><b>Plant Knowledge Hub</b><span>SDK Polyolefin · LLDPE Unit</span></div>
    </div>
    <div class="topmeta">
      <span class="chip" id="chipIndex"><span class="dot ok"></span><span></span></span>
      <span class="chip" id="chipAI"><span class="dot"></span><span>AI answers: connecting…</span></span>
      <span class="chip mono tnum" id="clock"></span>
    </div>
  </div>
  <nav class="tabs" role="tablist" id="tabs">
    <button class="tab" role="tab" data-v="plant">Plant</button>
    <button class="tab" role="tab" data-v="dataops">Data Ops <span class="n">Q1</span></button>
    <button class="tab" role="tab" data-v="ask">Ask <span class="n">Q2</span></button>
    <button class="tab" role="tab" data-v="asset">Asset 360 <span class="n">Q3</span></button>
    <button class="tab" role="tab" data-v="memory">Failure Memory <span class="n">Q3</span></button>
  </nav>
</header>

<main>
  <section class="tour" id="tour" aria-label="Guided scenario"></section>
  <div id="view" class="view" style="margin-top:16px"></div>
</main>

<!-- Data generated by scripts/build_data.py -->
<script src="data/docs.js"></script>
<script src="data/workorders.js"></script>
<script src="data/pids.js"></script>
<script src="data/kb.js"></script>
<script src="app.js"></script>
</body>
</html>
